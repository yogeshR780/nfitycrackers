<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>NiftyEdge — Contact</title>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
        font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
      }
      :root {
        --bg: #0b0f19;
        --text: #f8fafc;
        --text-soft: #94a3b8;
        --accent: #38bdf8;
        --accent2: #a855f7;
        --line: rgba(51, 65, 85, 0.8);
        --panel: rgba(15, 21, 36, 0.55);
      }
      body {
        background-color: var(--bg);
        background-image: url("contactbg.png");
        background-position: center;
        background-size: cover;
        background-repeat: no-repeat;
        background-attachment: fixed;
        color: var(--text);
        min-height: 100vh;
        display: flex;
        flex-direction: column;
      }

      /* Navbar */
      .navbar {
        display: grid;
        grid-template-columns: 1fr auto 1fr;
        align-items: center;
        padding: 24px 48px;
        width: 100%;
      }
      .brand {
        display: flex;
        align-items: center;
        gap: 10px;
        justify-self: start;
      }
      .brand-text {
        font-size: 22px;
        font-weight: 800;
        letter-spacing: 0.3px;
        line-height: 1.1;
      }
      .brand-accent {
        color: var(--accent);
      }
      .brand-tag {
        font-size: 9px;
        letter-spacing: 1.2px;
        color: var(--text-soft);
        margin-top: 2px;
      }
      .nav-links {
        display: flex;
        gap: 30px;
        justify-self: center;
      }
      .nav-link {
        color: var(--text);
        text-decoration: none;
        font-size: 16px;
        font-weight: 600;
        padding-bottom: 6px;
        border-bottom: 2px solid transparent;
        transition: color 0.2s ease;
      }
      .nav-link:hover {
        color: var(--accent);
      }
      .nav-link.active {
        color: var(--accent);
        border-image: linear-gradient(90deg, var(--accent), var(--accent2)) 1;
      }
      .logout-btn {
        justify-self: end;
        display: flex;
        align-items: center;
        gap: 8px;
        color: var(--text);
        text-decoration: none;
        border: 1px solid var(--accent2);
        border-radius: 8px;
        padding: 10px 22px;
        font-size: 15px;
        font-weight: 600;
        transition: background 0.2s ease;
      }
      .logout-btn:hover {
        background: rgba(168, 85, 247, 0.12);
      }

      /* Hero */
      .hero-wrap {
        flex: 1;
        display: flex;
        flex-direction: column;
        align-items: center;
        padding: 10px 24px 70px;
      }
      .hero-title {
        display: flex;
        align-items: center;
        gap: 14px;
        font-size: 46px;
        font-weight: 800;
        margin-top: 20px;
      }
      .hero-title .grad {
        background: linear-gradient(90deg, var(--accent), var(--accent2));
        -webkit-background-clip: text;
        background-clip: text;
        color: transparent;
      }
      .hero-title svg {
        stroke: var(--accent);
      }
      .hero-line {
        width: 90px;
        height: 3px;
        background: linear-gradient(90deg, var(--accent), var(--accent2));
        border-radius: 3px;
        margin: 20px 0 16px;
      }
      .hero-sub {
        color: var(--text-soft);
        font-size: 17px;
        margin-bottom: 44px;
      }

      /* Contact card */
      .contact-card {
        background: var(--panel);
        border: 1px solid rgba(56, 189, 248, 0.35);
        border-radius: 18px;
        backdrop-filter: blur(18px);
        -webkit-backdrop-filter: blur(18px);
        box-shadow:
          0 0 0 1px rgba(168, 85, 247, 0.08),
          0 20px 50px rgba(0, 0, 0, 0.45),
          0 0 40px rgba(56, 189, 248, 0.08);
        padding: 40px 46px 34px;
        width: 100%;
        max-width: 440px;
        text-align: center;
      }
      .avatar {
        width: 70px;
        height: 70px;
        border-radius: 50%;
        margin: 0 auto 20px;
        display: flex;
        align-items: center;
        justify-content: center;
        background: rgba(56, 189, 248, 0.08);
        border: 2px solid transparent;
        border-image: linear-gradient(135deg, var(--accent), var(--accent2)) 1;
        color: var(--accent);
      }
      .contact-card h2 {
        font-size: 22px;
        font-weight: 800;
      }
      .contact-card .role-sub {
        color: var(--text-soft);
        font-size: 14px;
        margin: 6px 0 22px;
      }
      .divider {
        border-top: 1px solid var(--line);
        margin: 0 0 22px;
      }

      .contact-row {
        display: flex;
        align-items: center;
        gap: 16px;
        text-align: left;
        padding-bottom: 20px;
        margin-bottom: 20px;
        border-bottom: 1px solid var(--line);
      }
      .contact-row:last-child {
        border-bottom: none;
        margin-bottom: 0;
        padding-bottom: 0;
      }
      .contact-icon {
        width: 44px;
        height: 44px;
        border-radius: 50%;
        background: linear-gradient(135deg, var(--accent), var(--accent2));
        display: flex;
        align-items: center;
        justify-content: center;
        color: #fff;
        flex-shrink: 0;
      }
      .contact-label {
        font-size: 11px;
        letter-spacing: 0.8px;
        text-transform: uppercase;
        color: var(--text-soft);
        margin-bottom: 4px;
      }
      .contact-value {
        font-size: 17px;
        font-weight: 700;
      }

      @media (max-width: 640px) {
        .navbar {
          grid-template-columns: 1fr;
          justify-items: center;
          gap: 14px;
          padding: 20px 24px;
        }
        .brand,
        .nav-links,
        .logout-btn {
          justify-self: center;
        }
        .hero-title {
          font-size: 32px;
        }
        .contact-card {
          padding: 32px 26px;
        }
      }
    </style>
  </head>
  <body>
    <nav class="navbar">
      <div class="brand">
        <svg width="34" height="34" viewBox="0 0 40 40" aria-hidden="true">
          <polyline
            points="4,30 14,18 22,26 36,6"
            fill="none"
            stroke="url(#brandGrad)"
            stroke-width="5"
            stroke-linecap="round"
            stroke-linejoin="round"
          ></polyline>
          <polyline
            points="26,6 36,6 36,16"
            fill="none"
            stroke="url(#brandGrad)"
            stroke-width="5"
            stroke-linecap="round"
            stroke-linejoin="round"
          ></polyline>
          <defs>
            <linearGradient id="brandGrad" x1="0" y1="0" x2="40" y2="40">
              <stop offset="0" stop-color="#38bdf8"></stop>
              <stop offset="1" stop-color="#a855f7"></stop>
            </linearGradient>
          </defs>
        </svg>
        <div>
          <div class="brand-text">
            NIFTY<span class="brand-accent">EDGE</span>
          </div>
          <div class="brand-tag">TRADE SMART. TRADE SAFE. TRADE WITH EDGE.</div>
        </div>
      </div>
      <div class="nav-links">
        <a href="index.html" class="nav-link">Home</a>
        <a href="contact.html" class="nav-link active">Contact Me</a>
      </div>
      <a href="index.html" class="logout-btn">
        <svg
          width="16"
          height="16"
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="2"
        >
          <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"></path>
          <polyline points="16,17 21,12 16,7"></polyline>
          <line x1="21" y1="12" x2="9" y2="12"></line>
        </svg>
        Logout
      </a>
    </nav>

    <div class="hero-wrap">
      <div class="hero-title">
        Let's <span class="grad">Connect</span>
        <svg
          width="34"
          height="34"
          viewBox="0 0 24 24"
          fill="none"
          stroke-width="2.5"
          stroke-linecap="round"
          stroke-linejoin="round"
        >
          <polyline points="3,17 9,11 13,15 21,5"></polyline>
          <polyline points="14,5 21,5 21,12"></polyline>
        </svg>
      </div>
      <div class="hero-line"></div>
      <p class="hero-sub"></p>

      <div class="contact-card">
        <div class="avatar">
          <svg
            width="30"
            height="30"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
          >
            <circle cx="12" cy="8" r="4"></circle>
            <path d="M4 21c0-4.4 3.6-8 8-8s8 3.6 8 8"></path>
          </svg>
        </div>
        <h2>Rohan Wandre</h2>
        <p class="role-sub">Feel Free To Reach Out</p>
        <div class="divider"></div>

        <div class="contact-row">
          <div class="contact-icon">
            <svg
              width="18"
              height="18"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
            >
              <path
                d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6 19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72c.127.96.361 1.903.7 2.81a2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45c.907.339 1.85.573 2.81.7A2 2 0 0 1 22 16.92z"
              ></path>
            </svg>
          </div>
          <div>
            <div class="contact-label">Phone</div>
            <div class="contact-value">+91 93240 49878</div>
          </div>
        </div>

        <div class="contact-row">
          <div class="contact-icon">
            <svg
              width="18"
              height="18"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
            >
              <rect x="2" y="4" width="20" height="16" rx="2"></rect>
              <path d="M2 7l10 6 10-6"></path>
            </svg>
          </div>
          <div>
            <div class="contact-label">Email</div>
            <div class="contact-value">rohanwandre310@gmail.com</div>
          </div>
        </div>
      </div>
    </div>
  </body>
</html>
